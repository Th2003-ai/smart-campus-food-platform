# =============================================================================
# 四个 server 块共用的路由规则（由 nginx.conf 通过 include 引入）
# 改这里等于同时改四个端，避免四份配置各改各的最后不一致。
# =============================================================================

# 前端入口。
# 项目用的是 hash 路由（createWebHashHistory，#/student/home），
# 服务端只需要返回 index.html 即可；这条 try_files 是为将来改 history 模式预留的。
location / {
    try_files $uri $uri/ /index.html;
}

# 构建产物带内容哈希，可以放心长缓存
location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# -----------------------------------------------------------------------------
# 后端接口：反向代理到双实例
#
# X-Upstream 响应头是本机演示用的「证据」：它由 Nginx 写入实际命中的后端地址，
# 连续请求就能看到 8080 / 8081 交替出现，说明负载均衡真的生效了。
# 生产环境可以去掉这个头，避免暴露内部拓扑。
# -----------------------------------------------------------------------------
location /api/ {
    proxy_pass          http://campus_backend/api/;
    proxy_http_version  1.1;
    # 配合 upstream 里的 keepalive：清空 Connection 才能复用长连接
    proxy_set_header    Connection        "";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    add_header          X-Upstream        $upstream_addr always;

    # 某台实例挂了：当前请求自动换另一台重试，用户基本无感
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
}

# -----------------------------------------------------------------------------
# WebSocket：/ws/order 用来推订单状态与新单提醒
#
# 必须转发 Upgrade / Connection，否则 Nginx 会当成普通 HTTP 请求，
# 握手直接失败（前端会一直重连）。超时设长，避免空闲连接被掐断。
# -----------------------------------------------------------------------------
location /api/ws/ {
    proxy_pass          http://campus_backend/api/ws/;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade    $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host       $host;
    proxy_read_timeout  3600s;
}
