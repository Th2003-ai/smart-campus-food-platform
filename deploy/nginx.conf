# =============================================================================
# 校园外卖平台 · Nginx 主配置（负载均衡 + 四端登录态隔离）
#
# 启动（-p 指定 nginx 安装目录，-c 指定本文件）：
#   D:\SE\nginx-1.28.3\nginx.exe -p D:\SE\nginx-1.28.3 -c D:\SE\smart-campus-food-platform-main\deploy\nginx.conf
# 重载 / 停止：把上面的启动参数换成 -s reload / -s stop
#
# 三个关键设计：
#   1) 端口用 8088 而不是 80 —— 本机 80 已被禅道(httpd)占用，强行监听会 bind 失败。
#   2) 四个子域名挂在同一个端口，主机名不同即不同 origin，
#      浏览器的 localStorage 按 origin 隔离 → 四个窗口可同时登录四个不同账号。
#   3) worker_processes 固定 2 个。auto 会按 CPU 核数开进程，本机 24 核会开 24 个 worker。
#
# 注意：本文件必须是 UTF-8 无 BOM。带 BOM 时 nginx 会报 unknown directive。
# 也不要用 PowerShell 的 Set-Content 改它，容易把中文写坏。
# =============================================================================

worker_processes  2;

events {
    worker_connections  1024;
}

http {
    include       D:/SE/nginx-1.28.3/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    # 日志带上游地址，用于验证「这次请求打到了哪台实例」
    log_format  campus  '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr  time=${request_time}s';
    access_log  logs/campus-access.log  campus;

    # ---------------------------------------------------------------------
    # 应用层双活：两个完全相同的 Spring Boot 实例
    #
    # max_fails / fail_timeout 是被动健康检查：连续失败 2 次后摘除 10 秒。
    # 两个实例必须连同一个 MySQL 和同一个 Redis，否则抢单锁、Token 黑名单
    # 这些共享状态会不一致（Redis 在本项目里不是可选组件）。
    # ---------------------------------------------------------------------
    upstream campus_backend {
        server 127.0.0.1:8080  max_fails=2  fail_timeout=10s;
        server 127.0.0.1:8081  max_fails=2  fail_timeout=10s;
        keepalive 32;
    }

    # ---------------------------------------------------------------------
    # 四个端：同一份前端产物(dist)，四个 server_name
    #
    # 路由权限仍由前端的 token.role 决定（见 router/index.ts 的守卫），
    # 这里的子域名只负责「隔离登录态」，不负责「锁定角色」。
    # ---------------------------------------------------------------------
    server {
        listen        8088;
        server_name   student.campus.local;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }

    server {
        listen        8088;
        server_name   merchant.campus.local;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }

    server {
        listen        8088;
        server_name   rider.campus.local;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }

    server {
        listen        8088;
        server_name   admin.campus.local;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }
}
