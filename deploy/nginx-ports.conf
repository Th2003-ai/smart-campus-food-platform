# =============================================================================
# 校园外卖平台 · Nginx 配置（端口模式 / 免管理员权限）
#
# 用途：当无法修改 hosts 文件时，用「不同端口」代替「不同子域名」。
#       浏览器的 localStorage 按 origin 隔离，而 origin = 协议+主机+端口，
#       所以四个端口同样是四个独立 origin，四个窗口可以各登一个账号。
#
# 启动：
#   D:\SE\nginx-1.28.3\nginx.exe -p D:\SE\nginx-1.28.3 -c D:\SE\smart-campus-food-platform-main\deploy\nginx-ports.conf
# 停止/重载：把最后换成 -s stop / -s reload
#
# 访问地址（浏览器直接可用，无需改 hosts）：
#   学生   http://localhost:8088
#   商户   http://localhost:8089
#   骑手   http://localhost:8090
#   管理员 http://localhost:8091
#
# 与 nginx.conf（子域名模式）功能完全等价，只是入口形式不同。
# 拿到管理员权限并配好 hosts 后，改用 nginx.conf 即可换回子域名模式。
#
# 注意：本文件必须是 UTF-8 无 BOM，带 BOM 会报 unknown directive。
# =============================================================================

worker_processes  2;

events {
    worker_connections  1024;
}

http {
    include       D:/SE/nginx-1.28.3/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    log_format  campus  '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr  time=${request_time}s';
    access_log  logs/campus-ports-access.log  campus;

    # 与 nginx.conf 共用同一个 upstream 定义（两个实例）
    upstream campus_backend {
        server 127.0.0.1:8080  max_fails=2  fail_timeout=10s;
        server 127.0.0.1:8081  max_fails=2  fail_timeout=10s;
        keepalive 32;
    }

    # 学生端 —— 8088
    server {
        listen        8088;
        server_name   student.campus.local localhost;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }

    # 商户端 —— 8089
    server {
        listen        8089;
        server_name   merchant.campus.local localhost;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }

    # 骑手端 —— 8090
    server {
        listen        8090;
        server_name   rider.campus.local localhost;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }

    # 管理员端 —— 8091
    server {
        listen        8091;
        server_name   admin.campus.local localhost;
        root          D:/SE/smart-campus-food-platform-main/frontend/dist;
        index         index.html;
        include       D:/SE/smart-campus-food-platform-main/deploy/campus-locations.conf;
    }
}
