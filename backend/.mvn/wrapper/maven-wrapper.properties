# =====================================================================
#  Maven Wrapper 配置 —— 让没装 Maven 的机器也能直接构建
#
#  用法（在 backend 目录下）：
#      mvnw.cmd clean package            # Windows
#      ./mvnw clean package              # Linux / macOS
#      mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev,local
#
#  首次执行会把 Maven 3.9.9 下载到 ~/.m2/wrapper 下并复用，
#  无需事先安装 Maven、也无需配置 MAVEN_HOME。
#
#  distributionSha256Sum 是 Maven 3.9.9 官方分发包的 SHA-256，
#  由本地下载后计算得到（Maven Central 未提供该 zip 的 .sha256，
#  如需交叉核对请对照 Apache 官方下载页的校验值）。
#  它用于校验下载完整性；若后续更换 distributionUrl，请同步更新此值。
# =====================================================================
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionSha256Sum=4ec3f26fb1a692473aea0235c300bd20f0f9fe741947c82c1234cefd76ac3a3c
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
