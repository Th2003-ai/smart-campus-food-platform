# =====================================================================
#  开发环境配置
#  【注意】本文件会被提交到仓库，请勿在此写入真实密码与密钥。
#  个人私密配置写在 application-local.yml（已在 .gitignore 中忽略），
#  模板见同目录 application-local.yml.example。
#
#  本地启动（三选一）：
#    1) 默认：后端连 localhost:3306 + localhost:6379
#    2) 改环境变量：DB_USERNAME / DB_PASSWORD / DB_HOST / REDIS_HOST ...
#    3) 覆盖文件：cp application-local.yml.example application-local.yml 后改内容
#  需要额外 profile 时：mvn spring-boot:run -Dspring-boot.run.profiles=dev,local
# =====================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息全部可通过环境变量覆盖，换电脑无需改代码：
    #   DB_URL  完整 JDBC 串（设置后忽略下面的 HOST/PORT/NAME）
    #   DB_HOST / DB_PORT / DB_NAME 拼接用（默认本机 3306 / campus_ai_delivery）
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_ai_delivery}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 支持三种写法：
    #   1) 环境变量            DB_PASSWORD=明文
    #   2) 本地文件覆盖        application-local.yml 里写明文（该文件已被 .gitignore 忽略）
    #   3) 加密存储（推荐）    ENC(密文)，解密口令来自 JASYPT_ENCRYPTOR_PASSWORD
    password: ${DB_PASSWORD:CHANGE_ME}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CampusHikariPool

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.campus.delivery: debug

# 开发环境启动时把演示账号密码初始化为预设口令（四个角色各不相同，见 DevDataInitializer 与 database/README.md）
campus:
  dev:
    init-demo-password: true
