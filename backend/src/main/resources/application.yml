# =====================================================================
#  公共配置（换电脑部署时通常只需改环境变量，不必改本文件）
#
#  可配置项一览（均为「环境变量 : 默认值」形式，环境变量优先）：
#    SERVER_PORT          服务端口               默认 8080
#    SERVER_CONTEXT_PATH  接口前缀               默认 /api
#    SPRING_PROFILES_ACTIVE 生效的 profile       默认 dev
#    DB_URL / DB_USERNAME / DB_PASSWORD          见 application-dev.yml
#    DB_HOST / DB_PORT / DB_NAME                 拆开配置数据库连接（可选）
#    REDIS_HOST / REDIS_PORT / REDIS_PASSWORD    见 application-dev.yml
#    JWT_SECRET           JWT 签名密钥（生产必改）
#    LLM_API_URL / LLM_API_KEY / LLM_MODEL       大模型配置
#    CORS_ALLOWED_ORIGINS 允许的前端来源
#    UPLOAD_LOCAL_PATH    本地上传目录
#    JASYPT_ENCRYPTOR_PASSWORD  解密 ENC(...) 的口令（见 docs/05-换机部署与配置.md）
# =====================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-ai-delivery
  profiles:
    # 默认同时激活 dev + local：
    #   dev   —— 数据库/Redis 连接等开发环境参数
    #   local —— 个人口令覆盖（application-local.yml，已被 .gitignore 忽略）
    # 说明：application-local.yml 不存在时 Spring 会自动忽略，不会报错；
    #       因此新机器上也可以用环境变量 DB_PASSWORD 代替。
    # 覆盖方式：SPRING_PROFILES_ACTIVE=dev 或 --spring.profiles.active=dev,local
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# ---------------------------------------------------------------------
# MyBatis-Plus
# ---------------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.delivery.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境请改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键为 VARCHAR(32)，使用无横线 UUID，与数据库脚本设计一致
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------------------------------------------------------------
# 接口文档（Knife4j）：http://localhost:8080/api/doc.html
# ---------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

# ---------------------------------------------------------------------
# 业务自定义配置
# ---------------------------------------------------------------------
campus:
  # JWT：secret 请通过环境变量 JWT_SECRET 注入，长度不少于 32 字符
  jwt:
    secret: ${JWT_SECRET:campus-ai-delivery-dev-secret-key-please-change-in-production}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    header: Authorization
    prefix: "Bearer "
  # 大模型：API Key 只存服务端，禁止下发前端
  ai:
    enabled: ${LLM_ENABLED:true}
    provider: ${LLM_PROVIDER:openai-compatible}
    api-url: ${LLM_API_URL:https://api.example.com/v1/chat/completions}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:your-model-name}
    temperature: ${LLM_TEMPERATURE:0.7}
    max-tokens: ${LLM_MAX_TOKENS:2048}
    timeout-ms: ${LLM_TIMEOUT_MS:15000}
    # 多轮对话上下文保留轮数（滑动窗口）
    context-rounds: ${LLM_CONTEXT_ROUNDS:6}
  # 文件存储：local 本地目录 / oss 对象存储
  file:
    storage: ${FILE_STORAGE:local}
    local-path: ${UPLOAD_LOCAL_PATH:./uploads}
    url-prefix: /static
  # 跨域允许来源（前端开发服务器地址，多个用英文逗号分隔）
  # 注意：必须写成逗号分隔的字符串，不能用 YAML 列表（- 开头），
  #       否则 WebMvcConfig 的 @Value("${campus.cors.allowed-origins}") 无法解析。
  #
  # 2026-10 补充：浏览器对 POST/PUT/DELETE 一定会带 Origin 头（即使是同源请求），
  # 后端因此会走 CORS 校验，Origin 不在白名单就直接回 403 Invalid CORS request。
  # 所以经 Nginx 子域名/端口访问时，必须把那些 origin 也加进来：
  #   http://*.campus.local:8088  —— 子域名模式（student/merchant/rider/admin 四个）
  #   http://localhost:8088~8091  —— 端口模式（deploy/nginx-ports.conf）
  # WebMvcConfig 用的是 allowedOriginPatterns，支持 * 通配。
  cors:
    # 追加「队友用局域网/虚拟网 IP 直接访问」的 origin：
    # Spring 的 allowedOriginPatterns 支持 :[*] 通配端口，
    # 所以一条规则覆盖 8088~8091 四个入口（见 deploy/nginx.conf 的 listen）。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://*.campus.local:8088,http://localhost:8088,http://localhost:8089,http://localhost:8090,http://localhost:8091,http://10.174.130.230:[*],http://26.171.182.93:[*]}

# ---------------------------------------------------------------------
# 敏感值加密（Jasypt）
# 把 DB_PASSWORD 之类改成 ENC(密文) 即可，解密口令来自环境变量
#   JASYPT_ENCRYPTOR_PASSWORD（或启动参数 -Djasypt.encryptor.password=...）
# 生成密文：见 common/util/ConfigEncryptor
# ---------------------------------------------------------------------
jasypt:
  encryptor:
    # 不设默认值：未配置时 Jasypt 视为「未启用」，此时不应在配置里写 ENC(...)，
    # 否则启动会明确报错（fail-closed，避免静默用了错误的密钥）
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    # 兼容旧写法：仅用于从明文迁移到 ENC() 期间，见 docs/05-换机部署与配置.md
    property:
      prefix: "ENC("
      suffix: ")"

logging:
  level:
    root: info
    com.campus.delivery: debug
